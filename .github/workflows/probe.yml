name: probe (dev)
on:
  push:
    branches: [probe-run]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/probe.py none probe_out ${{ vars.PROBE_ONLY }}
      - name: Save results to probe-results branch
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          mv probe_out /tmp/probe_out
          git checkout --orphan probe-results
          git rm -rf . > /dev/null
          cp -r /tmp/probe_out ./probe_out
          git add probe_out
          git commit -m "probe results ${{ github.run_id }}"
          git push -f origin probe-results
