name: 채용 알림

on:
  schedule:
    # 한국 시간 08:50, 12:50, 17:50, 21:50 (GitHub 일정은 몇 분~수십 분 늦을 수 있음)
    - cron: "50 23,3,8,12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "디스코드로 보내지 않고 결과만 확인"
        type: boolean
        default: false
  push:
    branches: [test-run, run-now]   # 개발용: test-run=시험 실행, run-now=바로 실제 실행

permissions:
  contents: write

concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브라우저 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - run: python -m playwright install --with-deps chromium

      - name: 공고 확인
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          DRY_RUN: ${{ (github.ref_name == 'test-run' || inputs.dry_run) && '1' || '0' }}
          DEBUG_BODY: ${{ github.ref_name == 'test-run' && '1' || '0' }}
        run: python -m jobalert.main

      - name: 결과 요약
        if: always()
        run: test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 기록 저장
        if: github.ref_name != 'test-run' && !inputs.dry_run
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "기록 업데이트"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 시험 실행 결과 저장
        if: always() && github.ref_name == 'test-run'
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          cp report.md /tmp/report.md || echo "no report" > /tmp/report.md
          git checkout --orphan test-report
          git rm -rf . > /dev/null
          cp /tmp/report.md report.md
          git add report.md
          git commit -m "test report ${{ github.run_id }}"
          git push -f origin test-report
